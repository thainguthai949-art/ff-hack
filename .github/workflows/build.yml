name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    - name: Build App
      run: |
        make package
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: HackApp
        path: packages/*.ipa